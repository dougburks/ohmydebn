"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
[](blue)\
[󰱰](bg:blue fg:black)\
$username\
[](bg:cyan fg:blue)\
$directory\
[](fg:cyan bg:green)\
$git_branch\
$git_status\
[ ](fg:green)\
$line_break$character"""

# The palette section has been removed to use your terminal's dynamic colors.

# The OhMyDebn logo leads the prompt, the same on every distro. It replaced
# Starship's os module, which ran lsb_release before every prompt to pick a
# distro logo - about 30 ms of each prompt.

[username]
show_always = true
style_user = "bg:blue fg:black"
style_root = "bg:blue fg:black"
format = '[ $user ]($style)'

[directory]
style = "fg:black bg:cyan"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:green"
format = '[[ $symbol $branch ](fg:black bg:green)]($style)'

[git_status]
style = "bg:green"
format = '[[($all_status$ahead_behind )](fg:black bg:green)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:cyan)'
vimcmd_replace_one_symbol = '[](bold fg:red)'
vimcmd_replace_symbol = '[](bold fg:red)'
vimcmd_visual_symbol = '[](bold fg:blue)'
