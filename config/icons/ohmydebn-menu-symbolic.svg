<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- OhMyDebn Menu, for dark themes: a solid grinning face with the eyes
       and mouth cut out. Symbolic, so the desktop recolors it with the
       theme's text color. Cut-outs use evenodd in one path: GTK recolors
       by forcing every shape's fill, so masks wouldn't work. -->
