<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- OhMyDebn Menu: ":D" on the 16 px grid. A symbolic icon, so the
       desktop recolors it with the theme's text color. -->
  <g fill="#bebebe" shape-rendering="crispEdges">
    <rect x="1" y="4" width="2" height="2"/>
    <rect x="1" y="10" width="2" height="2"/>
    <rect x="5" y="1" width="8" height="1"/>
    <rect x="5" y="2" width="9" height="1"/>
    <rect x="5" y="3" width="3" height="10"/>
    <rect x="11" y="3" width="4" height="1"/>
    <rect x="12" y="4" width="3" height="8"/>
    <rect x="11" y="12" width="4" height="1"/>
    <rect x="5" y="13" width="9" height="1"/>
    <rect x="5" y="14" width="8" height="1"/>
  </g>
</svg>
